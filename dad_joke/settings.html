<div class="form-group">
  <label for="title" class="form-label">Header Text</label>
  <input id="title" name="title" type="text" class="form-input" placeholder="Dad Joke" />
</div>

<div class="form-group">
  <label for="footer" class="form-label">Footer Text</label>
  <input id="footer" name="footer" type="text" class="form-input" placeholder="Powered by API Ninjas" />
  <small> Optional footer text shown under the joke. </small>
</div>

<hr style="border: 0; border-top: 1px solid rgba(0, 0, 0, 0.12); margin: 24px 0 18px" />

<div class="form-group" style="margin-bottom: 20px">
  <div
    style="
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #555;
      margin-bottom: 10px;
    "
  >
    Plugin Repository
  </div>

  <div style="background: #f8f9fa; border: 1px solid #dcdfe3; border-radius: 10px; padding: 14px 16px">
    <a
      href="https://github.com/shadal18/inkypi-dad-joke"
      target="_blank"
      rel="noopener noreferrer"
      style="
        color: #0d6efd;
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
        word-break: break-word;
        display: inline-block;
        margin-bottom: 6px;
      "
    >
      github.com/shadal18/inkypi-dad-joke
    </a>

    <div style="font-size: 0.9rem; color: #666">Setup help, updates, release notes, and source code.</div>
  </div>
</div>

<style>
  .floatingchat-container-wrap,
  .floating-chat-kofi-popup-iframe {
    left: unset !important;
    right: 16px !important;
  }

  .floatingchat-container-wrap {
    bottom: 14px !important;
  }

  .floating-chat-kofi-popup-iframe {
    bottom: 76px !important;
  }
</style>

<script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const titleInput = document.getElementById("title")
    const footerInput = document.getElementById("footer")

    if (typeof loadPluginSettings !== "undefined" && loadPluginSettings) {
      if (titleInput) titleInput.value = pluginSettings.title || "Dad Joke"
      if (footerInput) footerInput.value = pluginSettings.footer || "Powered by API Ninjas"
    } else {
      if (titleInput) titleInput.value = "Dad Joke"
      if (footerInput) footerInput.value = "Powered by API Ninjas"
    }

    if (typeof kofiWidgetOverlay !== "undefined") {
      kofiWidgetOverlay.draw("shadal", {
        type: "floating-chat",
        "floating-chat.donateButton.text": "More coffee",
        "floating-chat.donateButton.background-color": "#00b9fe",
        "floating-chat.donateButton.text-color": "#fff",
      })
    }
  })
</script>
